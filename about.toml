accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "IJG",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
]
targets = [
    "aarch64-linux-android",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
workarounds = ["ring", "rustls", "rustix"]

# Rawler is intentionally the only copyleft Rust decoder dependency. Keep its
# LGPL exception scoped to this package instead of widening the global list.
[rawler]
accepted = ["LGPL-2.1"]
