[package]
name = "calibraw-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "CalibRaw ONNX Runtime bindings for BiRefNet, SAM 2.1, and RAW denoise"
publish = false

[dependencies]
calibraw-core.workspace = true
calibraw-gpu.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
half.workspace = true
hex.workspace = true
image.workspace = true
log.workspace = true
rayon.workspace = true
ring.workspace = true
serde.workspace = true
ureq.workspace = true
wgpu.workspace = true
zip.workspace = true

# Desktop loads the automatic runtime and registers its WebGPU plugin at run
# time, so no execution provider is compiled in.
[target.'cfg(not(target_os = "android"))'.dependencies]
flate2.workspace = true
ort = { workspace = true, features = ["load-dynamic"] }
tar.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ort = { workspace = true, features = ["download-binaries", "copy-dylibs", "tls-rustls", "nnapi", "xnnpack"] }

[dev-dependencies]
pollster.workspace = true
tempfile.workspace = true
