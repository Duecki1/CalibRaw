[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/calibraw-core",
    "crates/calibraw-gpu",
    "crates/calibraw-ai",
    "crates/calibraw-ui",
    "crates/calibraw-ffi",
    "crates/calibraw-cli",
]
default-members = [
    "crates/calibraw-core",
    "crates/calibraw-gpu",
    "crates/calibraw-ai",
    "crates/calibraw-ui",
    "crates/calibraw-ffi",
    "crates/calibraw-cli",
]
exclude = ["vendor/winit", "vendor/wgpu", "vendor/wgpu-hal", "vendor/naga"]

[patch.crates-io]
# Shader layout and image-query fixes, documented in vendor/naga/CALIBRAW_PATCHES.md.
naga = { path = "vendor/naga" }
# Android Destroy/recreation fix, kept on the released 0.30.13 API.
winit = { path = "vendor/winit" }
# Preserve the native error and queue-upload phase before wgpu erases them.
wgpu = { path = "vendor/wgpu" }
wgpu-hal = { path = "vendor/wgpu-hal" }

# TEMPORARY: Moduwu 5.0.0 (UI density) is not pushed yet. Push it, set the
# `rev` above to its commit and delete this section.
[patch."https://github.com/Duecki1/Moduwu"]
moduwu-design = { path = "../moduwu-design" }

[workspace.metadata]
# F-Droid reads this committed value when checking release tags. Increase it
# for every release; GitHub APKs keep their existing Git-history version codes.
fdroid_version_code = 1000714
android_ndk_version = "28.2.13676358"
android_build_tools_version = "35.0.0"
android_compile_sdk = 36
android_min_sdk = 26
android_target_sdk = 36
# LibRaw master commit (2026-11-08; reports itself as 0.23.0). Releases up to
# 0.22.2 lack the Sony A7 V, A1 II, Canon EOS R50 V and Hasselblad X2D II 100C.
libraw_revision = "a9a14b1970d188c25dade81f8326ff00a6e33649"
# Lensfun master commit (2026-11-04; reports itself as 0.3.99). The last
# release, 0.3.4 from 2023, lacks the lens profiles added since.
lensfun_revision = "52cf1a7b0e82e07e0ecaa3391ee5106a6dd1ee54"
android_use_legacy_packaging = false
# The SDK CMake package that builds ONNX Runtime (1.30 needs CMake 3.28); the
# other native dependencies keep AGP's 3.22.1.
android_onnxruntime_cmake_version = "4.1.2"

[workspace.package]
version = "1.5.1"
edition = "2021"
rust-version = "1.92.0"
authors = ["Duecki <calibraw@dueckis.de>"]
license = "GPL-3.0-or-later"
homepage = "https://calibraw.dueckis.de"
repository = "https://github.com/Duecki1/CalibRaw"
readme = "README.md"

[workspace.dependencies]
moduwu-design = { version = "5.0.0", git = "https://github.com/Duecki1/Moduwu", rev = "28b27ba09810921e54aaa720e0cb5410bdefa05c" }
calibraw-core = { version = "1.5.1", path = "crates/calibraw-core" }
calibraw-gpu = { version = "1.5.1", path = "crates/calibraw-gpu" }
calibraw-ai = { version = "1.5.1", path = "crates/calibraw-ai" }
calibraw-ui = { version = "1.5.1", path = "crates/calibraw-ui" }
calibraw-ffi = { version = "1.5.1", path = "crates/calibraw-ffi" }
calibraw-cli = { version = "1.5.1", path = "crates/calibraw-cli" }

anyhow = "1.0"
base64 = "0.22"
bytemuck = { version = "1.16", features = ["derive"] }
csv = "1"
discord-rich-presence = "1.1.0"
exif = { package = "kamadak-exif", version = "0.6.1" }
flate2 = "1.1"
half = "2.7"
# Young pure-Rust HEIC decoder: pinned so updates are reviewed before use.
heic-rs = "=0.1.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
image-webp = "0.2.4"
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
jiff = "0.2.31"
log = "0.4"
memmap2 = "0.9"
png = "0.18"
pollster = "0.4"
quick-xml = "0.41"
rayon = "1.10"
rawler = "=0.8.0"
ring = "0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
semver = "1.0"
sys-locale = "0.3.2"
skrifa = { version = "0.42", default-features = false, features = ["std"] }
tempfile = "3.27"
tiff = { version = "0.11", default-features = false }
tar = "0.4"
toml_edit = "0.25"
trash = "5.2"
ureq = { version = "3.1", default-features = false, features = ["multipart", "rustls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zune-core = "0.5.1"
zune-jpegxl = "0.5.2"

eframe = { version = "0.35", default-features = false }
egui = "0.35"
egui-phosphor = "0.13"
egui-wgpu = "0.35"
wgpu = "29"
# The versions wgpu-hal 29 uses, for its Vulkan and Metal handles.
ash = { version = "0.38", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }
# The versions eframe's other macOS dependencies use, for the app menu.
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString"] }
# The version winit uses, for the UIKit view eframe creates on iOS.
raw-window-handle = "=0.6.2"
naga = { version = "29", features = ["wgsl-in"] }
naga_oil = { version = "=0.22.0", default-features = false }

env_logger = { version = "=0.11.11", default-features = false, features = ["humantime", "regex"] }
rfd = "=0.17.2"
# API 22 (ONNX Runtime 1.22) registers plugin execution providers, which the
# desktop WebGPU provider is.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-22"] }

android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.22"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

bindgen = "=0.72.1"
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 1
