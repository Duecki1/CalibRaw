name: Build Windows

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 (GNU + LibRaw)
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            msystem: MINGW64
            msys_prefix: /mingw64
            toolchain_package: mingw-w64-x86_64-toolchain
            clang_package: mingw-w64-x86_64-clang
            autotools_package: mingw-w64-x86_64-autotools
            libraw_deps: >-
              mingw-w64-x86_64-lcms2
              mingw-w64-x86_64-libjpeg-turbo
              mingw-w64-x86_64-zlib
            lensfun_package: mingw-w64-x86_64-lensfun
            compiler: x86_64-w64-mingw32-gcc
            cxx_compiler: x86_64-w64-mingw32-g++
            artifact_arch: x86_64
            vc_redist_arch: x64
            vc_runtime_dlls: msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll
          - name: ARM64 (GNU LLVM + LibRaw)
            runner: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            msystem: CLANGARM64
            msys_prefix: /clangarm64
            toolchain_package: mingw-w64-clang-aarch64-toolchain
            clang_package: mingw-w64-clang-aarch64-clang
            autotools_package: mingw-w64-clang-aarch64-autotools
            libraw_deps: >-
              mingw-w64-clang-aarch64-lcms2
              mingw-w64-clang-aarch64-libjpeg-turbo
              mingw-w64-clang-aarch64-zlib
            lensfun_package: mingw-w64-clang-aarch64-lensfun
            compiler: clang
            cxx_compiler: clang++
            artifact_arch: arm64
            vc_redist_arch: arm64
            vc_runtime_dlls: msvcp140.dll msvcp140_1.dll vcruntime140.dll

    defaults:
      run:
        shell: msys2 {0}

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      PKG_CONFIG_ALLOW_CROSS: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
      CC_aarch64_pc_windows_gnullvm: clang
      CXX_aarch64_pc_windows_gnullvm: clang++
      AR_aarch64_pc_windows_gnullvm: llvm-ar
      # Clang calls this ABI "gnu"; its triple parser does not accept Rust's
      # equivalent "gnullvm" suffix when bindgen parses native headers.
      BINDGEN_EXTRA_CLANG_ARGS_aarch64_pc_windows_gnullvm: --target=aarch64-pc-windows-gnu

    steps:
      # Line endings
      - name: Configure deterministic Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Normalize and verify checkout
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          git reset --hard HEAD

          $changes = git status --porcelain=v1 --untracked-files=all
          if ($changes) {
            $changes | Write-Host
            throw "Checkout is dirty before the build starts."
          }

      - name: Read the Rust version from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, pinned 2026-07-14
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-${{ matrix.target }}

      - name: Install MSYS2 build dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: >-
            git
            make
            python
            zip
            ${{ matrix.toolchain_package }}
            ${{ matrix.clang_package }}
            ${{ matrix.autotools_package }}
            ${{ matrix.libraw_deps }}
            ${{ matrix.lensfun_package }}

      # MSYS2's LibRaw package is a release that lacks newer cameras, so build
      # the pinned commit into the MSYS2 prefix, where packaging finds its DLL.
      - name: Build pinned LibRaw
        run: |
          bash scripts/build_libraw.sh ${{ matrix.msys_prefix }} \
            --build="$MINGW_CHOST" \
            --host="$MINGW_CHOST" \
            CC=${{ matrix.compiler }} \
            CXX=${{ matrix.cxx_compiler }}

      - name: Verify native dependencies
        run: |
          export PKG_CONFIG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/lib/pkgconfig);$(cygpath -w ${{ matrix.msys_prefix }}/share/pkgconfig)"
          export LIBCLANG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/bin)"

          ${{ matrix.compiler }} --version
          objdump --version
          cargo --version
          rustc --version
          pkg-config --modversion libraw || pkg-config --modversion libraw_r
          pkg-config --modversion lensfun
          test -f ${{ matrix.msys_prefix }}/bin/libclang.dll

      - name: Test LibRaw Unicode paths
        run: |
          export PKG_CONFIG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/lib/pkgconfig);$(cygpath -w ${{ matrix.msys_prefix }}/share/pkgconfig)"
          export LIBCLANG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/bin)"

          cargo test --locked --package calibraw-core --target "${{ matrix.target }}" --lib pipeline::raw_loader::libraw_loader::tests

      - name: Build release binaries
        env:
          CALIBRAW_DISCORD_APPLICATION_ID: ${{ secrets.CALIBRAW_DISCORD_APPLICATION_ID }}
        run: |
          export PKG_CONFIG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/lib/pkgconfig);$(cygpath -w ${{ matrix.msys_prefix }}/share/pkgconfig)"
          export LIBCLANG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/bin)"

          revision="$(git rev-parse --verify HEAD)"
          export CALIBRAW_REQUIRE_COMMITTED_SOURCE=1
          export CALIBRAW_SOURCE_REVISION="$revision"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$revision")"

          bash scripts/generate_licenses.sh
          cargo build \
            --locked \
            --release \
            --package calibraw-ui \
            --target "${{ matrix.target }}" \
            --bin calibraw

          release_dir="target/${{ matrix.target }}/release"
          test -f "$release_dir/calibraw.exe"
          objdump -h "$release_dir/calibraw.exe" | grep -q '\.rsrc'
          # GUI subsystem
          objdump -p "$release_dir/calibraw.exe" | grep -Eq 'Subsystem[[:space:]]+00000002[[:space:]]+\(Windows GUI\)'
          test "$(git rev-parse --verify HEAD)" = "$revision"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # Automatic mode downloads Microsoft's ONNX Runtime, which imports the
      # MSVC runtime listed in vc_runtime_dlls. It is built with Visual Studio
      # 2022 17.14 and hangs while loading against runtimes older than 14.40,
      # which Windows installs may still have in System32. Windows resolves
      # these imports from calibraw.exe's directory first, so ship them there.
      - name: Stage Visual C++ runtime for ONNX Runtime
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) {
            throw "Visual Studio was not found on the runner."
          }
          $versionFile = Join-Path $vs "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile -Raw).Trim()
          $archDir = Join-Path $vs "VC\Redist\MSVC\$redistVersion\${{ matrix.vc_redist_arch }}"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) {
            throw "No Visual C++ runtime redistributable found in $archDir."
          }

          $staging = Join-Path $env:RUNNER_TEMP "vc-runtime"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($name in "${{ matrix.vc_runtime_dlls }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            $dll = Join-Path $crt.FullName $name
            if (-not (Test-Path $dll -PathType Leaf)) {
              throw "Visual C++ runtime is missing $name in $($crt.FullName)."
            }
            $version = (Get-Item $dll).VersionInfo.FileVersionRaw
            if ($version -lt [version]"14.40") {
              throw "$name is version $version; ONNX Runtime needs 14.40 or newer."
            }
            Copy-Item $dll $staging
          }
          Set-Content -NoNewline -Path (Join-Path $staging "version.txt") -Value $redistVersion

      - name: Package portable Windows artifact
        run: |
          export PKG_CONFIG_PATH="$(cygpath -w ${{ matrix.msys_prefix }}/lib/pkgconfig);$(cygpath -w ${{ matrix.msys_prefix }}/share/pkgconfig)"

          release_dir="target/${{ matrix.target }}/release"
          package_name="CalibRaw-windows-${{ matrix.artifact_arch }}"
          package_dir="dist/$package_name"

          rm -rf dist
          mkdir -p "$package_dir"
          cp "$release_dir/calibraw.exe" "$package_dir/"
          cp COPYING THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md README.md "$package_dir/"

          vc_runtime_dir="$(cygpath -u "$RUNNER_TEMP")/vc-runtime"
          for dll in ${{ matrix.vc_runtime_dlls }}; do
            cp "$vc_runtime_dir/$dll" "$package_dir/"
          done

          lensfun_db="$(find ${{ matrix.msys_prefix }}/share/lensfun -type f -name '*.xml' -printf '%h\n' | head -n 1)"
          test -n "$lensfun_db"
          mkdir -p "$package_dir/lensfun"
          cp -a "$lensfun_db"/. "$package_dir/lensfun/"
          test -n "$(find "$package_dir/lensfun" -name '*.xml' -print -quit)"

          # Resolve the PE import table without executing target binaries. In
          # particular, MSYS2's ldd can hang while inspecting ARM64 binaries.
          declare -A inspected_dlls=()
          dependency_queue=("$package_dir/calibraw.exe")
          while [ "${#dependency_queue[@]}" -gt 0 ]; do
            binary="${dependency_queue[0]}"
            dependency_queue=("${dependency_queue[@]:1}")
            echo "Inspecting imports for $(basename "$binary")"

            while IFS= read -r dll_name; do
              [ -n "$dll_name" ] || continue
              dll_key="${dll_name,,}"
              if [ -n "${inspected_dlls[$dll_key]+present}" ]; then
                continue
              fi
              inspected_dlls[$dll_key]=1

              dll_path="$(find ${{ matrix.msys_prefix }}/bin -maxdepth 1 -type f -iname "$dll_name" -print -quit)"
              if [ -z "$dll_path" ]; then
                continue
              fi

              destination="$package_dir/$(basename "$dll_path")"
              echo "Bundling $(basename "$dll_path")"
              cp "$dll_path" "$destination"
              dependency_queue+=("$destination")
            done < <(objdump -p "$binary" | awk '/DLL Name:/ { print $3 }')
          done

          libraw_version="$(pkg-config --modversion libraw 2>/dev/null || pkg-config --modversion libraw_r) ($(cat ${{ matrix.msys_prefix }}/share/calibraw/libraw-revision))"
          lensfun_version="$(pkg-config --modversion lensfun)"
          {
            echo "CalibRaw Windows ${{ matrix.artifact_arch }} build"
            echo "Source revision: $(git rev-parse --verify HEAD)"
            echo "Rust compiler: $(rustc --version)"
            echo "Target: ${{ matrix.target }}"
            echo "LibRaw: $libraw_version"
            echo "Lensfun: $lensfun_version"
            echo "Visual C++ runtime: $(cat "$vc_runtime_dir/version.txt")"
          } > "$package_dir/BUILD-INFO.txt"

          # Artifact
          test -f "$package_dir/calibraw.exe"
          # Checksums
          (cd "$package_dir" && sha256sum calibraw.exe *.dll 2>/dev/null | sort -k2 > SHA256SUMS.txt || true)
          test -s "$package_dir/SHA256SUMS.txt"

          # Produce the actual portable ZIP that is published on GitHub Releases.
          (cd dist && zip -qr "$package_name.zip" "$package_name")
          test -s "dist/$package_name.zip"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # The installer recursively packages the portable staging directory,
          # keeping both distribution formats on the same runtime payload.
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            "C:\Program Files\Inno Setup 6\ISCC.exe"
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe"
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found on the runner."
          }

          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE."
          }
          $appVersion = ($metadata.packages | Where-Object name -eq "calibraw-ui").version
          if (-not $appVersion) {
            throw "Could not determine the calibraw-ui package version."
          }

          & $iscc `
            "/DAppVersion=$appVersion" `
            "/DArtifactArch=${{ matrix.artifact_arch }}" `
            "packaging/windows/calibraw.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = "dist/CalibRaw-windows-${{ matrix.artifact_arch }}-setup.exe"
          if (-not (Test-Path $installer -PathType Leaf)) {
            throw "Expected installer was not created: $installer"
          }

      - name: Upload portable Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CalibRaw-windows-${{ matrix.artifact_arch }}
          path: dist/CalibRaw-windows-${{ matrix.artifact_arch }}.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CalibRaw-windows-${{ matrix.artifact_arch }}-installer
          path: dist/CalibRaw-windows-${{ matrix.artifact_arch }}-setup.exe
          if-no-files-found: error
