name: Build macOS

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew's libraries on this runner require macOS 26.0, so the app
          # does too. LibRaw and Lensfun are built for it: without a target they
          # would require the runner's newer SDK version.
          - name: Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
            artifact_arch: arm64
            deployment_target: "26.0"
          # There is no macOS 26 Intel runner.
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_arch: x86_64

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      LIBRAW_PREFIX: /tmp/calibraw-libraw
      LENSFUN_PREFIX: /tmp/calibraw-lensfun
      PKG_CONFIG_PATH: /tmp/calibraw-libraw/lib/pkgconfig:/tmp/calibraw-lensfun/lib/pkgconfig

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Read the Rust version from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-07-14
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: macos-${{ matrix.target }}

      - name: Install native dependencies
        run: >-
          brew install
          autoconf automake libtool jpeg-turbo little-cms2 libomp
          cmake glib llvm pkg-config dylibbundler

      # Homebrew's LibRaw is a release that lacks newer cameras, so build the
      # pinned commit. Apple Clang has no built-in OpenMP, so LibRaw's OpenMP
      # check is pointed at Homebrew's libomp to keep its threaded decoders.
      # The deployment target is empty, so the default, on Intel. It is not set for
      # the Rust build, which targets an older macOS by default.
      - name: Build pinned LibRaw
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          set -euxo pipefail

          jpeg_prefix="$(brew --prefix jpeg-turbo)"
          libomp_prefix="$(brew --prefix libomp)"
          LIBTOOLIZE=glibtoolize bash scripts/build_libraw.sh "$LIBRAW_PREFIX" \
            "CPPFLAGS=-I$jpeg_prefix/include -I$libomp_prefix/include" \
            "LDFLAGS=-L$jpeg_prefix/lib -L$libomp_prefix/lib -lomp" \
            "ax_cv_c_openmp=-Xpreprocessor -fopenmp"

      # Homebrew's Lensfun is the 0.3.4 release, so build the pinned commit.
      - name: Build pinned Lensfun
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/build_lensfun.sh "$LENSFUN_PREFIX"

      - name: Verify native toolchain
        run: |
          set -euxo pipefail

          test "$(uname -m)" = "${{ matrix.artifact_arch }}"
          rustc --version
          cargo --version
          pkg-config --modversion libraw
          pkg-config --modversion lensfun
          cat "$LENSFUN_PREFIX/share/calibraw/lensfun-revision"
          test -d "$(brew --prefix llvm)/lib"

      - name: Build release application
        env:
          CALIBRAW_DISCORD_APPLICATION_ID: ${{ secrets.CALIBRAW_DISCORD_APPLICATION_ID }}
        run: |
          set -euxo pipefail

          revision="$(git rev-parse --verify HEAD)"
          export CALIBRAW_REQUIRE_COMMITTED_SOURCE=1
          export CALIBRAW_SOURCE_REVISION="$revision"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$revision")"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"

          bash scripts/generate_licenses.sh
          cargo build \
            --locked \
            --release \
            --package calibraw-ui \
            --target "${{ matrix.target }}" \
            --bin calibraw

          binary="target/${{ matrix.target }}/release/calibraw"
          test -f "$binary"
          test "$(file "$binary")" != "${binary}: data"
          file "$binary" | grep -q "${{ matrix.artifact_arch }}"
          test "$(git rev-parse --verify HEAD)" = "$revision"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Package macOS application
        run: |
          set -euxo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          minimum_system="${{ matrix.deployment_target || '12.0' }}"
          package_name="CalibRaw-macos-${{ matrix.artifact_arch }}"
          app_dir="dist/$package_name/CalibRaw.app"
          contents="$app_dir/Contents"
          executable="$contents/MacOS/calibraw"

          rm -rf dist
          mkdir -p \
            "$contents/MacOS" \
            "$contents/MacOS/lensfun" \
            "$contents/Frameworks" \
            "$contents/Resources"

          cp "target/${{ matrix.target }}/release/calibraw" "$executable"
          chmod +x "$executable"
          cp COPYING THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md README.md "$contents/Resources/"

          # Only an Icon Composer document adapts to Liquid Glass, and compiling one
          # needs Xcode 26 or newer, which is not the macOS 15 runner's default;
          # actool from 26.5 is reported to crash on .icon documents. actool writes
          # Assets.car for macOS 26 and later, and CalibRaw.icns for older systems.
          xcode=/Applications/Xcode_26.3.app/Contents/Developer
          actool=("$xcode/usr/bin/actool")
          # Before macOS 26 its icon renderer crashes against the system frameworks
          # and must load the ones Xcode bundles. This runs Xcode's tool itself
          # because the SIP-protected /usr/bin stub that xcrun uses strips DYLD_*.
          if (( "$(sw_vers -productVersion | cut -d . -f 1)" < 26 )); then
            actool=(env "DYLD_FRAMEWORK_PATH=$xcode/Platforms/MacOSX.platform/System/AssetRuntime/System/Library/PrivateFrameworks" "${actool[@]}")
          fi
          "${actool[@]}" \
            packaging/icons/CalibRaw.icon \
            --compile "$contents/Resources" \
            --app-icon CalibRaw \
            --include-all-app-icons \
            --platform macosx \
            --target-device mac \
            --minimum-deployment-target 12.0 \
            --output-partial-info-plist "$(mktemp)" \
            --errors \
            --warnings
          test -s "$contents/Resources/Assets.car"
          test -s "$contents/Resources/CalibRaw.icns"
          # The catalog must hold the adaptive icon, and the full-size rendition older
          # macOS shows; actool's CalibRaw.icns stops at 256 pixels. Both are matched by
          # rendition name in the raw file: assetutil is a system tool, not part of
          # Xcode, so on macOS 15 it is older than the catalog it would be reading.
          LC_ALL=C grep -aq 'CalibRaw\.iconstack' "$contents/Resources/Assets.car"
          LC_ALL=C grep -aq 'CalibRaw1024x1024_' "$contents/Resources/Assets.car"

          lensfun_db="$(find "$LENSFUN_PREFIX/share/lensfun" -type f -name '*.xml' -print | head -n 1)"
          test -n "$lensfun_db"
          lensfun_db="$(dirname "$lensfun_db")"
          cp -a "$lensfun_db"/. "$contents/MacOS/lensfun/"
          test -n "$(find "$contents/MacOS/lensfun" -name '*.xml' -print -quit)"

          cat > "$contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>CalibRaw</string>
            <key>CFBundleExecutable</key>
            <string>calibraw</string>
            <key>CFBundleIdentifier</key>
            <string>de.duecki.calibraw</string>
            <key>CFBundleIconFile</key>
            <string>CalibRaw.icns</string>
            <key>CFBundleIconName</key>
            <string>CalibRaw</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>CalibRaw</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>$minimum_system</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          dylibbundler \
            -od \
            -b \
            -x "$executable" \
            -d "$contents/Frameworks" \
            -p '@executable_path/../Frameworks'

          {
            echo "CalibRaw macOS ${{ matrix.artifact_arch }} build"
            echo "Source revision: $(git rev-parse --verify HEAD)"
            echo "Rust compiler: $(rustc --version)"
            echo "Target: ${{ matrix.target }}"
            echo "LibRaw: $(pkg-config --modversion libraw) ($(cat "$LIBRAW_PREFIX/share/calibraw/libraw-revision"))"
            echo "Lensfun: $(pkg-config --modversion lensfun) ($(cat "$LENSFUN_PREFIX/share/calibraw/lensfun-revision"))"
          } > "$contents/Resources/BUILD-INFO.txt"

          # Ad-hoc signatures are only applied to main and version-tag builds.
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ]]; then
            codesign --force --deep --sign - "$app_dir"
            codesign --verify --deep --strict --verbose=2 "$app_dir"
          fi

          file "$executable" | grep -q "${{ matrix.artifact_arch }}"
          test -n "$(find "$contents/Frameworks" -name '*.dylib' -print -quit)"
          test -z "$(otool -L "$executable" | awk '/\\/opt\\/homebrew|\\/usr\\/local\\/Cellar/ { print }')"

          # A build with a deployment target must run on the version Info.plist states:
          # a bundled library that needs a newer macOS would crash at launch instead.
          if [[ -n "${{ matrix.deployment_target }}" ]]; then
            while IFS= read -r -d '' binary; do
              minos="$(otool -l "$binary" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
              test -n "$minos"
              if [[ "$(printf '%s\n' "$minos" "$minimum_system" | sort -V | tail -n 1)" != "$minimum_system" ]]; then
                echo "$binary requires macOS $minos, above $minimum_system" >&2
                exit 1
              fi
            done < <(find "$executable" "$contents/Frameworks" -type f -print0)
          fi

          (
            cd "dist/$package_name"
            shasum -a 256 "CalibRaw.app/Contents/MacOS/calibraw" > SHA256SUMS.txt
          )
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" \
            "dist/$package_name.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CalibRaw-macos-${{ matrix.artifact_arch }}
          path: |
            dist/CalibRaw-macos-${{ matrix.artifact_arch }}.zip
            dist/CalibRaw-macos-${{ matrix.artifact_arch }}/SHA256SUMS.txt
          if-no-files-found: error
