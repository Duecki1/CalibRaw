name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"

          expected_tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match workspace version '$version'." >&2
            echo "Expected tag: $expected_tag" >&2
            exit 1
          fi

  linux:
    name: Build Linux
    needs: validate
    uses: ./.github/workflows/build-linux-appimage.yml
    secrets: inherit

  android:
    name: Build Android
    needs: validate
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  windows:
    name: Build Windows
    needs: validate
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  macos:
    name: Build macOS
    needs: validate
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  ios:
    name: Build iOS
    needs: validate
    uses: ./.github/workflows/build-ios.yml

  publish:
    name: Publish GitHub Release
    needs:
      - linux
      - android
      - windows
      - macos
      - ios
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded-artifacts

      - name: Collect direct release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            case "$file" in
              *.AppImage|*.exe|*.zip|*.apk|*.ipa)
                cp "$file" "release-assets/$(basename "$file")"
                ;;
            esac
          done < <(find downloaded-artifacts -type f -print0)

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '  %f\n' | sort

          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*-setup.exe' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'CalibRaw-windows-*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'CalibRaw-macos-*.zip' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.ipa' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 10

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "CalibRaw ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
