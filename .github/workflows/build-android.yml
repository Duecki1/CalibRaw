name: Build Android

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      distribution:
        description: "`github` builds the APK; `googleplay` builds a signed AAB without GitHub update checks."
        type: string
        default: github

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    name: ${{ inputs.distribution == 'googleplay' && 'Android App Bundle (Google Play)' || 'Android APK' }}
    runs-on: ubuntu-latest
    env:
      CALIBRAW_DISTRIBUTION: ${{ inputs.distribution || 'github' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Restore pinned Android toolchains
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/android-sdk
            ~/.gradle/wrapper
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-ndk-env
            ~/.cargo/bin/cargo-ndk-runner
            ~/.cargo/bin/cargo-ndk-test
          key: calibraw-android-tools-${{ runner.os }}-${{ runner.arch }}-arm64-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/bootstrap_download.py', 'xtask/src/**') }}-v2

      - name: Restore Android dependency and build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.gradle/caches
            ~/.gradle/notifications
            android/.gradle
          key: calibraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/build.rs', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            calibraw-android-build-${{ runner.os }}-${{ runner.arch }}-arm64-rust-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Restore Android native dependency cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: android/native
          key: android-native-deps-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'android/app/src/main/cpp/CMakeLists.txt', 'xtask/src/**') }}
          restore-keys: |
            android-native-deps-v1-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android and native build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            libclang-dev \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Prepare release signing keystore
        if: inputs.distribution == 'googleplay' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CALIBRAW_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.CALIBRAW_ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.CALIBRAW_ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CALIBRAW_ANDROID_KEY_PASSWORD }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CALIBRAW_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.CALIBRAW_PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.CALIBRAW_PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.CALIBRAW_PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # Google Play bundles are signed with a separate upload key, which
          # Google can reset; never fall back to the GitHub release key.
          if [ "$CALIBRAW_DISTRIBUTION" = "googleplay" ]; then
            secret_prefix=CALIBRAW_PLAY_UPLOAD
            KEYSTORE_BASE64="$PLAY_UPLOAD_KEYSTORE_BASE64"
            CALIBRAW_ANDROID_STORE_PASSWORD="$PLAY_UPLOAD_STORE_PASSWORD"
            CALIBRAW_ANDROID_KEY_ALIAS="$PLAY_UPLOAD_KEY_ALIAS"
            CALIBRAW_ANDROID_KEY_PASSWORD="$PLAY_UPLOAD_KEY_PASSWORD"
          else
            secret_prefix=CALIBRAW_ANDROID
            KEYSTORE_BASE64="$RELEASE_KEYSTORE_BASE64"
            CALIBRAW_ANDROID_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            CALIBRAW_ANDROID_KEY_ALIAS="$RELEASE_KEY_ALIAS"
            CALIBRAW_ANDROID_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          fi
          export CALIBRAW_ANDROID_STORE_PASSWORD

          : "${KEYSTORE_BASE64:?Missing ${secret_prefix}_KEYSTORE_BASE64 repository secret}"
          : "${CALIBRAW_ANDROID_STORE_PASSWORD:?Missing ${secret_prefix}_STORE_PASSWORD repository secret}"
          : "${CALIBRAW_ANDROID_KEY_ALIAS:?Missing ${secret_prefix}_KEY_ALIAS repository secret}"
          : "${CALIBRAW_ANDROID_KEY_PASSWORD:?Missing ${secret_prefix}_KEY_PASSWORD repository secret}"

          keystore_path="$RUNNER_TEMP/calibraw-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass:env CALIBRAW_ANDROID_STORE_PASSWORD \
            -alias "$CALIBRAW_ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'CALIBRAW_ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path"
            printf 'CALIBRAW_ANDROID_STORE_PASSWORD=%s\n' "$CALIBRAW_ANDROID_STORE_PASSWORD"
            printf 'CALIBRAW_ANDROID_KEY_ALIAS=%s\n' "$CALIBRAW_ANDROID_KEY_ALIAS"
            printf 'CALIBRAW_ANDROID_KEY_PASSWORD=%s\n' "$CALIBRAW_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build arm64 Android APK
        id: build_android_apk
        shell: bash
        run: |
          set -euxo pipefail

          bootstrap_download_verified() {
            python3 scripts/bootstrap_download.py "$1" "$2" "$3"
          }

          mkdir -p android/native/downloads
          if ! bootstrap_download_verified \
            https://github.com/neovim/deps/raw/b9bf36eb31f27e8136d907da38fa23518927737e/opt/libiconv-1.17.tar.gz \
            android/native/downloads/libiconv-1.17.tar.gz \
            8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313; then
            bootstrap_download_verified \
              https://mirrors.edge.kernel.org/gnu/libiconv/libiconv-1.17.tar.gz \
              android/native/downloads/libiconv-1.17.tar.gz \
              8f74213b56238c85a50a5329f77e06198771e70dd9a739779f4c02f65d971313
          fi

          bootstrap_download_verified \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init \
            /tmp/rustup-init \
            https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --profile minimal \
            --default-toolchain "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          if [ "$(cargo ndk --version 2>/dev/null || true)" != "cargo-ndk 4.1.2" ]; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

          build_metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          export CALIBRAW_ANDROID_COMPILE_SDK="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_compile_sdk"])')"
          export CALIBRAW_ANDROID_BUILD_TOOLS_VERSION="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_build_tools_version"])')"
          export CALIBRAW_ANDROID_NDK_VERSION="$(printf '%s' "$build_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["metadata"]["android_ndk_version"])')"

          install_sdk_packages() {
            local attempt
            for attempt in 1 2 3 4; do
              if sdkmanager \
                "platform-tools" \
                "platforms;android-$CALIBRAW_ANDROID_COMPILE_SDK" \
                "build-tools;$CALIBRAW_ANDROID_BUILD_TOOLS_VERSION" \
                "ndk;$CALIBRAW_ANDROID_NDK_VERSION" \
                "cmake;$ANDROID_CMAKE_VERSION"; then
                return 0
              fi
              echo "sdkmanager failed on attempt $attempt; retrying..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }

          ANDROID_HOME="$HOME/android-sdk"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          ANDROID_CMAKE_VERSION="3.22.1"
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_CMAKE_VERSION

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf /tmp/android-command-line-tools
            mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-command-line-tools
            ANDROID_CMDLINE_TOOLS_SHA512=b65e830d7655fb39cc9eee669806977f462c49375807ef2c6487fabcc9afdbc210465ce6a1e2429ff95c74ca519d1239daf9a403c30b8d0bdb7a0962af656c8e
            bootstrap_download_verified \
              https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip \
              /tmp/android-command-line-tools.zip \
              "sha512:$ANDROID_CMDLINE_TOOLS_SHA512"
            unzip -q /tmp/android-command-line-tools.zip -d /tmp/android-command-line-tools
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/android-command-line-tools/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          install_sdk_packages
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$CALIBRAW_ANDROID_NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/$ANDROID_CMAKE_VERSION/bin:$PATH"

          LIBCLANG_SO="$(find /usr/lib -path '*/llvm-*/lib/libclang.so*' -print -quit 2>/dev/null || true)"
          if [ -n "$LIBCLANG_SO" ]; then
            export LIBCLANG_PATH="$(dirname "$LIBCLANG_SO")"
          fi

          bash scripts/generate_licenses.sh
          CALIBRAW_ALLOW_NO_LIBRAW=1 cargo check --locked --workspace
          ./gradlew --version
          # JVM-only unit tests; calibrawBuildRust=false skips CMake and Rust.
          ./gradlew --no-daemon --stacktrace -p android :app:testDebugUnitTest -PcalibrawBuildRust=false

          feature_args=()
          if [ "$CALIBRAW_DISTRIBUTION" = "googleplay" ]; then
            gradle_task=bundleRelease
            apk_path="android/app/build/outputs/bundle/release/app-release.aab"
            output_name="CalibRaw-googleplay-arm64-v8a.aab"
            artifact_name="calibraw-android-googleplay-arm64-v8a"
            signing_args=(-PcalibrawRequireReleaseSigning=true)
            # Google Play delivers updates, so the GitHub update check is compiled out.
            feature_args=(-PcalibrawRustFeatures=googleplay)
            # Same sequence as release APKs below. Play rejects a reused
            # versionCode, so upload only one bundle per commit.
            version_code=$((1000000 + $(git rev-list --count HEAD)))
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            gradle_task=assembleRelease
            apk_path="android/app/build/outputs/apk/release/app-release.apk"
            output_name="CalibRaw-release-arm64-v8a.apk"
            artifact_name="calibraw-android-release-arm64-v8a"
            signing_args=(-PcalibrawRequireReleaseSigning=true)
            # The release workflow has its own run-number sequence. Use the
            # checked-out commit so a tag and its main-branch build share a
            # versionCode, while newer commits can update older installations.
            # The offset also puts these codes above the old run-number codes.
            version_code=$((1000000 + $(git rev-list --count HEAD)))
          else
            gradle_task=assembleDebug
            apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
            output_name="CalibRaw-debug-arm64-v8a.apk"
            artifact_name="calibraw-android-debug-arm64-v8a"
            signing_args=()
            version_code="$GITHUB_RUN_NUMBER"
          fi

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -p android \
            "$gradle_task" \
            -PcalibrawAbis=arm64-v8a \
            -PcalibrawVersionCode="$version_code" \
            "${signing_args[@]}" \
            "${feature_args[@]}"

          APK="$apk_path"
          test -f "$APK"
          if [ "$CALIBRAW_DISTRIBUTION" = "googleplay" ]; then
            # Play builds the device APKs from the bundle and checks their
            # 16 KB alignment itself; the APK build covers the same libraries.
            jarsigner_output="$(jarsigner -verify -certs "$APK")"
            printf '%s\n' "$jarsigner_output"
            grep -q '^jar verified\.' <<<"$jarsigner_output"
          else
            cargo xtask verify-android-16kb "$APK"
          fi
          if [ "$CALIBRAW_DISTRIBUTION" != "googleplay" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && { [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then
            "$ANDROID_HOME/build-tools/$CALIBRAW_ANDROID_BUILD_TOOLS_VERSION/apksigner" \
              verify --verbose --print-certs "$APK"
          fi
          mkdir -p dist
          cp "$APK" "dist/$output_name"
          sha256sum "dist/$output_name" > "dist/$output_name.sha256"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Remove release signing keystore
        if: always() && (inputs.distribution == 'googleplay' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/calibraw-release.keystore"
          {
            echo "CALIBRAW_ANDROID_KEYSTORE_PATH="
            echo "CALIBRAW_ANDROID_STORE_PASSWORD="
            echo "CALIBRAW_ANDROID_KEY_ALIAS="
            echo "CALIBRAW_ANDROID_KEY_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.build_android_apk.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          # The Play bundle is only a hand-off to the Play Console; 0 keeps the repository default.
          retention-days: ${{ inputs.distribution == 'googleplay' && 7 || 0 }}
