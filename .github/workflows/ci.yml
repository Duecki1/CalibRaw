name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CALIBRAW_REQUIRE_LENSFUN: "1"
      PKG_CONFIG_PATH: /tmp/calibraw-libraw/lib/pkgconfig:/tmp/calibraw-lensfun/lib/pkgconfig
      LD_LIBRARY_PATH: /tmp/calibraw-libraw/lib:/tmp/calibraw-lensfun/lib

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libclang-dev autoconf automake libtool \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libglib2.0-dev \
            libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev libxkbcommon-dev \
            mesa-vulkan-drivers

      - name: Build pinned LibRaw
        run: bash scripts/build_libraw.sh /tmp/calibraw-libraw

      - name: Build pinned Lensfun
        run: bash scripts/build_lensfun.sh /tmp/calibraw-lensfun

      - name: Read the Rust version from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-07-14
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D warnings -W clippy::perf -W clippy::large_stack_arrays
          -W clippy::redundant_clone -W unreachable-pub

      - name: Cache Vulkan shader validator
        id: spirv-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/calibraw-spirv-tools/spirv-val
          key: spirv-val-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/build_spirv_val.sh') }}

      - name: Build pinned Vulkan shader validator
        if: steps.spirv-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_spirv_val.sh /tmp/calibraw-spirv-tools

      - name: Run tests and validate Vulkan shader binaries
        env:
          CALIBRAW_SPIRV_VAL: /tmp/calibraw-spirv-tools/spirv-val
        run: cargo test --locked --workspace --all-targets

      - name: Check architecture boundaries
        run: cargo xtask arch-check

      - name: Check target_os conditions do not spread
        run: cargo xtask cfg-ratchet

      - name: Check the Rust/Java JNI contract
        run: cargo xtask jni-contract

      - name: Check UI code uses the shared controls
        run: cargo xtask ui-lint

      - name: Check no migration of older files is due for removal
        run: cargo xtask migrations

      - name: Build release artifacts
        env:
          CALIBRAW_DISCORD_APPLICATION_ID: ${{ secrets.CALIBRAW_DISCORD_APPLICATION_ID }}
        run: cargo build --workspace --release --locked
