name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libclang-dev libraw-dev liblensfun-dev liblensfun-data-v1 \
            libasound2-dev libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libglib2.0-dev \
            libgl1-mesa-dev libudev-dev libwayland-dev libx11-dev libxkbcommon-dev

      - name: Read the Rust version from rust-toolchain.toml
        id: rust
        shell: bash
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, pinned 2026-07-14
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets --all-features --
          -D warnings -W clippy::perf -W clippy::large_stack_arrays
          -W clippy::redundant_clone -W unreachable-pub

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

      - name: Check architecture boundaries
        run: cargo xtask arch-check

      - name: Check the Rust/Java JNI contract
        run: cargo xtask jni-contract

      - name: Check UI code uses the shared controls
        run: cargo xtask ui-lint

      - name: Check no migration of older files is due for removal
        run: cargo xtask migrations

      - name: Build release artifacts
        env:
          CALIBRAW_DISCORD_APPLICATION_ID: ${{ secrets.CALIBRAW_DISCORD_APPLICATION_ID }}
        run: cargo build --workspace --release --locked
