name: Feature request
description: Suggest an improvement or new feature for CalibRaw
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or limitation you are running into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature or behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional. Include workarounds, examples, mockups, or related ideas.

  - type: checkboxes
    id: human
    attributes:
      label: Confirmation
      options:
        - label: I'm not a bot.
          required: true
